# Purpose: ClusterIP + NodePort Services for the single-Deployment releases (Tasks 3,5,6).
# Apply: kubectl apply -f manifests/rolling/service.yaml
apiVersion: v1
kind: Service
metadata: {name: notice-board, namespace: nb-02230120, labels: {app: notice-board}}
spec:
  type: ClusterIP
  selector: {app: notice-board}        # matches every Pod of the Deployment
  ports:
    - {name: http, port: 80, targetPort: http}   # targetPort uses the NAMED container port
---
apiVersion: v1
kind: Service
metadata: {name: notice-board-ext, namespace: nb-02230120, labels: {app: notice-board}}
spec:
  type: NodePort
  selector: {app: notice-board}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30090}  # 30090 is mapped to host 127.0.0.1:30090 by kind
