# Purpose: kind cluster for CTE412 practical (1 control-plane + 2 workers), student 02230120.
# Apply:   kind create cluster --config cluster/kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cte412-02230120            # cluster name must contain the student number
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30090   # NodePort of notice-board-ext
        hostPort: 30090        # same port on the host so curl localhost:30090 works
        listenAddress: "127.0.0.1"  # bind to loopback only (lab rule)
        protocol: TCP
  - role: worker               # worker 1
  - role: worker               # worker 2
